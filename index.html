<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>レトロ・インベーダーゲーム (SPACE INVADERS)</title>
    <!-- Tailwind CSS for sleek UI styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Yuji+Syuku&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Press Start 2P', monospace;
            background-color: #050508;
            color: #33ff33;
            user-select: none;
            touch-action: manipulation;
            overflow: hidden;
        }

        .arcade-container {
            position: relative;
            box-shadow: 0 0 30px rgba(51, 255, 51, 0.2), inset 0 0 15px rgba(0, 0, 0, 0.8);
            border: 4px solid #1a331a;
            border-radius: 12px;
            background: #000;
        }

        /* Scanline effect for CRT feel */
        .crt-overlay::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 10;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
            opacity: 0.8;
        }

        .glow-text {
            text-shadow: 0 0 8px currentColor;
        }

        .btn-arcade {
            transition: all 0.1s ease;
            box-shadow: 0 4px 0 #15803d, 0 0 12px rgba(34, 197, 94, 0.4);
        }

        .btn-arcade:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #15803d;
        }

        /* Touch control buttons styling */
        .touch-btn {
            background: rgba(34, 197, 94, 0.15);
            border: 2px solid rgba(34, 197, 94, 0.5);
            color: #22c55e;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            user-select: none;
            -webkit-user-select: none;
        }

        .touch-btn:active {
            background: rgba(34, 197, 94, 0.4);
        }

        canvas {
            display: block;
            image-rendering: pixelated;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-2 sm:p-4">

    <!-- Header HUD -->
    <div class="w-full max-w-2xl flex justify-between items-center mb-2 px-2 text-xs sm:text-sm glow-text">
        <div>SCORE: <span id="scoreVal" class="text-white">00000</span></div>
        <div>HIGH: <span id="highScoreVal" class="text-yellow-400">00000</span></div>
        <div>WAVE: <span id="waveVal" class="text-cyan-400">1</span></div>
    </div>

    <!-- Main Game Frame -->
    <div class="arcade-container crt-overlay w-full max-w-2xl relative flex flex-col items-center">
        <!-- Canvas -->
        <canvas id="gameCanvas" width="600" height="700" class="w-full h-auto max-h-[70vh] object-contain"></canvas>

        <!-- Overlay Menu: Start Screen -->
        <div id="startMenu" class="absolute inset-0 bg-black/90 flex flex-col items-center justify-center p-6 text-center z-20">
            <h1 class="text-2xl sm:text-4xl text-green-500 font-bold mb-4 glow-text animate-pulse">
                SPACE<br><span class="text-red-500">INVADERS</span>
            </h1>
            <div class="text-xs sm:text-sm text-gray-300 space-y-2 mb-6">
                <p class="text-yellow-400 mb-4">=== SCORE TABLE ===</p>
                <p>🛸 MYSTERY UFO = ??? PTS</p>
                <p>👾 SQUID = 30 PTS</p>
                <p>👾 CRAB = 20 PTS</p>
                <p>👾 OCTOPUS = 10 PTS</p>
            </div>
            <div class="text-xs text-gray-400 mb-6 hidden sm:block">
                操作: [←] [→] 移動 | [SPACE] 発射 | [P] 一時停止
            </div>
            <button id="startBtn" class="btn-arcade bg-green-600 hover:bg-green-500 text-white font-bold py-3 px-8 rounded-lg text-sm sm:text-base cursor-pointer">
                GAME START
            </button>
        </div>

        <!-- Overlay Menu: Game Over Screen -->
        <div id="gameOverMenu" class="absolute inset-0 bg-black/90 flex flex-col items-center justify-center p-6 text-center z-20 hidden">
            <h2 class="text-3xl sm:text-5xl text-red-600 font-bold mb-2 glow-text animate-bounce">GAME OVER</h2>
            <p id="finalScore" class="text-sm sm:text-lg text-white mb-6">FINAL SCORE: 0</p>
            <button id="restartBtn" class="btn-arcade bg-red-600 hover:bg-red-500 text-white font-bold py-3 px-8 rounded-lg text-sm sm:text-base cursor-pointer">
                PLAY AGAIN
            </button>
        </div>

        <!-- Overlay Menu: Pause Screen -->
        <div id="pauseMenu" class="absolute inset-0 bg-black/80 flex flex-col items-center justify-center z-20 hidden">
            <h2 class="text-3xl text-yellow-400 font-bold mb-4 glow-text">PAUSED</h2>
            <p class="text-xs text-gray-300">Press 'P' or Tap to Resume</p>
        </div>
    </div>

    <!-- Controls / Footer -->
    <div class="w-full max-w-2xl mt-3 flex flex-col items-center gap-3">
        <!-- On-Screen Touch Controls (Visible on mobile/tablets or available always) -->
        <div class="w-full flex justify-between gap-3 px-2 sm:hidden">
            <div class="flex gap-2 w-1/2">
                <button id="btnLeft" class="touch-btn flex-1 py-4 font-bold">◀</button>
                <button id="btnRight" class="touch-btn flex-1 py-4 font-bold">▶</button>
            </div>
            <button id="btnFire" class="touch-btn w-1/2 py-4 font-bold text-red-400 border-red-500/50 bg-red-500/10 active:bg-red-500/30">🔥 FIRE</button>
        </div>

        <!-- Utility Bar -->
        <div class="w-full flex justify-between items-center px-2 text-[10px] sm:text-xs text-gray-400">
            <button id="soundToggle" class="hover:text-green-400 flex items-center gap-1 cursor-pointer">
                🔊 <span id="soundStatus">SOUND: ON</span>
            </button>
            <span>LIVES: <span id="livesContainer" class="text-red-500">❤️❤️❤️</span></span>
            <button id="pauseBtn" class="hover:text-yellow-400 cursor-pointer">⏸️ PAUSE</button>
        </div>
    </div>

    <script>
        // Canvas & Context setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Virtual width/height for classic aspect ratio
        const GAME_WIDTH = 600;
        const GAME_HEIGHT = 700;

        // UI Element references
        const scoreVal = document.getElementById('scoreVal');
        const highScoreVal = document.getElementById('highScoreVal');
        const waveVal = document.getElementById('waveVal');
        const livesContainer = document.getElementById('livesContainer');
        const startMenu = document.getElementById('startMenu');
        const gameOverMenu = document.getElementById('gameOverMenu');
        const pauseMenu = document.getElementById('pauseMenu');
        const finalScore = document.getElementById('finalScore');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const soundToggle = document.getElementById('soundToggle');
        const soundStatus = document.getElementById('soundStatus');
        const pauseBtn = document.getElementById('pauseBtn');

        // Touch Control Elements
        const btnLeft = document.getElementById('btnLeft');
        const btnRight = document.getElementById('btnRight');
        const btnFire = document.getElementById('btnFire');

        // Sound State & Web Audio Synthesizer
        let soundEnabled = true;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            if (!soundEnabled || !audioCtx) return;

            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'shoot') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(800, now);
                    osc.frequency.exponentialRampToValueAtTime(100, now + 0.15);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'explosion') {
                    // White noise approximation for explosion
                    const bufferSize = audioCtx.sampleRate * 0.2;
                    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                    const output = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        output[i] = Math.random() * 2 - 1;
                    }
                    const whiteNoise = audioCtx.createBufferSource();
                    whiteNoise.buffer = buffer;

                    const filter = audioCtx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(800, now);
                    filter.frequency.linearRampToValueAtTime(50, now + 0.2);

                    const noiseGain = audioCtx.createGain();
                    noiseGain.gain.setValueAtTime(0.3, now);
                    noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);

                    whiteNoise.connect(filter);
                    filter.connect(noiseGain);
                    noiseGain.connect(audioCtx.destination);

                    whiteNoise.start(now);
                    whiteNoise.stop(now + 0.2);
                } else if (type === 'invaderKill') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.linearRampToValueAtTime(600, now + 0.1);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'invaderStep') {
                    osc.type = 'triangle';
                    const freq = [120, 100, 90, 80][gameStepCount % 4];
                    osc.frequency.setValueAtTime(freq, now);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'ufo') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.linearRampToValueAtTime(600, now + 0.2);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                }
            } catch (e) {
                console.error("Audio playback error:", e);
            }
        }

        let score = 0;
        let highScore = localStorage.getItem('invaders_highscore') || 0;
        let wave = 1;
        let lives = 3;
        let gameState = 'START'; // 'START', 'PLAYING', 'PAUSED', 'GAMEOVER'
        let gameStepCount = 0;

        highScoreVal.textContent = String(highScore).padStart(5, '0');

        // Keyboard control tracking
        const keys = {
            ArrowLeft: false,
            ArrowRight: false,
            KeyA: false,
            KeyD: false,
            Space: false
        };

        // Player Ship
        const player = {
            x: GAME_WIDTH / 2 - 20,
            y: GAME_HEIGHT - 60,
            width: 40,
            height: 24,
            speed: 5,
            isHit: false,
            hitTimer: 0,
            draw() {
                if (this.isHit) {
                    // Flicker when damaged
                    if (Math.floor(Date.now() / 50) % 2 === 0) return;
                }
                ctx.fillStyle = '#33ff33'; // Neon green
                // Canvas pixel art for Cannon
                ctx.fillRect(this.x + 16, this.y, 8, 6);
                ctx.fillRect(this.x + 12, this.y + 6, 16, 6);
                ctx.fillRect(this.x + 4, this.y + 12, 32, 6);
                ctx.fillRect(this.x, this.y + 18, 40, 6);
            }
        };

        // Projectile System
        let playerBullets = [];
        let invaderBullets = [];

        class Bullet {
            constructor(x, y, vy, color, isPlayer = false) {
                this.x = x;
                this.y = y;
                this.width = 4;
                this.height = 12;
                this.vy = vy;
                this.color = color;
                this.isPlayer = isPlayer;
            }
            update() {
                this.y += this.vy;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.width, this.height);
            }
        }

        // Particle System for Explosions
        let particles = [];
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 6;
                this.vy = (Math.random() - 0.5) * 6;
                this.size = Math.random() * 3 + 1;
                this.color = color;
                this.life = 1.0;
                this.decay = Math.random() * 0.05 + 0.02;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillRect(this.x, this.y, this.size, this.size);
                ctx.globalAlpha = 1.0;
            }
        }

        function createExplosion(x, y, color = '#ff3333', count = 15) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        const INVADER_ROWS = 5;
        const INVADER_COLS = 11;
        let invaders = [];
        let invaderDirection = 1; // 1 = Right, -1 = Left
        let invaderMoveTimer = 0;
        let invaderMoveInterval = 40; // Frames per step (decreases as invaders die)
        let invaderAnimationFrame = 0;

        // Invader Types (0: Squid/Top, 1: Crab/Middle, 2: Octopus/Bottom)
        class Invader {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.width = 32;
                this.height = 24;
                this.type = type; // 0, 1, or 2
                this.alive = true;
                this.points = [30, 20, 10][type];
                this.color = ['#ff3399', '#00ffff', '#ffff33'][type];
            }

            draw() {
                if (!this.alive) return;

                ctx.fillStyle = this.color;
                const frame = invaderAnimationFrame;

                // Render vector pixel representations based on type
                if (this.type === 0) { // Squid
                    ctx.fillRect(this.x + 12, this.y, 8, 4);
                    ctx.fillRect(this.x + 8, this.y + 4, 16, 4);
                    ctx.fillRect(this.x + 4, this.y + 8, 24, 4);
                    ctx.fillRect(this.x + 8, this.y + 12, 16, 4);
                    if (frame === 0) {
                        ctx.fillRect(this.x + 4, this.y + 16, 8, 8);
                        ctx.fillRect(this.x + 20, this.y + 16, 8, 8);
                    } else {
                        ctx.fillRect(this.x, this.y + 16, 8, 8);
                        ctx.fillRect(this.x + 24, this.y + 16, 8, 8);
                    }
                } else if (this.type === 1) { // Crab
                    ctx.fillRect(this.x + 4, this.y + 4, 24, 4);
                    ctx.fillRect(this.x, this.y + 8, 32, 4);
                    ctx.fillRect(this.x + 4, this.y + 12, 24, 4);
                    if (frame === 0) {
                        ctx.fillRect(this.x, this.y + 16, 8, 8);
                        ctx.fillRect(this.x + 24, this.y + 16, 8, 8);
                    } else {
                        ctx.fillRect(this.x + 8, this.y + 16, 4, 8);
                        ctx.fillRect(this.x + 20, this.y + 16, 4, 8);
                    }
                } else { // Octopus
                    ctx.fillRect(this.x + 8, this.y, 16, 4);
                    ctx.fillRect(this.x + 4, this.y + 4, 24, 4);
                    ctx.fillRect(this.x + 4, this.y + 8, 24, 4);
                    ctx.fillRect(this.x + 8, this.y + 12, 16, 4);
                    if (frame === 0) {
                        ctx.fillRect(this.x + 4, this.y + 16, 8, 8);
                        ctx.fillRect(this.x + 20, this.y + 16, 8, 8);
                    } else {
                        ctx.fillRect(this.x + 10, this.y + 16, 12, 8);
                    }
                }
            }
        }

        function createInvaderGrid() {
            invaders = [];
            const startX = 50;
            const startY = 80 + (wave - 1) * 10;
            const spacingX = 42;
            const spacingY = 36;

            for (let row = 0; row < INVADER_ROWS; row++) {
                let type = 2; // Bottom Octopus
                if (row === 0) type = 0; // Top Squid
                else if (row === 1 || row === 2) type = 1; // Middle Crab

                for (let col = 0; col < INVADER_COLS; col++) {
                    const x = startX + col * spacingX;
                    const y = startY + row * spacingY;
                    invaders.push(new Invader(x, y, type));
                }
            }
            invaderDirection = 1;
            invaderMoveInterval = Math.max(8, 45 - wave * 3);
        }

        class Shield {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 60;
                this.height = 40;
                // Grid matrix of pixels for destructible shield (12x8 blocks)
                this.rows = 8;
                this.cols = 12;
                this.blockWidth = 5;
                this.blockHeight = 5;
                this.grid = [];

                for (let r = 0; r < this.rows; r++) {
                    this.grid[r] = [];
                    for (let c = 0; c < this.cols; c++) {
                        // Create arch shape cutout
                        if (r >= 5 && (c >= 4 && c <= 7)) {
                            this.grid[r][c] = false;
                        } else if (r === 0 && (c === 0 || c === this.cols - 1)) {
                            this.grid[r][c] = false;
                        } else {
                            this.grid[r][c] = true;
                        }
                    }
                }
            }

            draw() {
                ctx.fillStyle = '#33ff33';
                for (let r = 0; r < this.rows; r++) {
                    for (let c = 0; c < this.cols; c++) {
                        if (this.grid[r][c]) {
                            ctx.fillRect(this.x + c * this.blockWidth, this.y + r * this.blockHeight, this.blockWidth, this.blockHeight);
                        }
                    }
                }
            }

            // Damage shield upon bullet hit
            damage(hitX, hitY, radius = 2) {
                const col = Math.floor((hitX - this.x) / this.blockWidth);
                const row = Math.floor((hitY - this.y) / this.blockHeight);

                let hit = false;
                for (let r = row - radius; r <= row + radius; r++) {
                    for (let c = col - radius; c <= col + radius; c++) {
                        if (r >= 0 && r < this.rows && c >= 0 && c < this.cols) {
                            if (this.grid[r][c]) {
                                this.grid[r][c] = false;
                                hit = true;
                            }
                        }
                    }
                }
                return hit;
            }
        }

        let shields = [];
        function createShields() {
            shields = [];
            const shieldCount = 4;
            const spacing = GAME_WIDTH / (shieldCount + 1);
            for (let i = 0; i < shieldCount; i++) {
                shields.push(new Shield(spacing * (i + 1) - 30, GAME_HEIGHT - 140));
            }
        }

        class UFO {
            constructor() {
                this.width = 48;
                this.height = 20;
                this.active = false;
                this.x = -this.width;
                this.y = 50;
                this.speed = 3;
                this.points = [50, 100, 150, 300];
            }

            spawn() {
                this.active = true;
                this.x = -this.width;
                playSound('ufo');
            }

            update() {
                if (!this.active) return;
                this.x += this.speed;
                if (this.x > GAME_WIDTH) {
                    this.active = false;
                }
            }

            draw() {
                if (!this.active) return;
                ctx.fillStyle = '#ff3333'; // Red UFO
                ctx.fillRect(this.x + 16, this.y, 16, 4);
                ctx.fillRect(this.x + 8, this.y + 4, 32, 6);
                ctx.fillRect(this.x, this.y + 10, 48, 6);
                ctx.fillRect(this.x + 12, this.y + 16, 6, 4);
                ctx.fillRect(this.x + 30, this.y + 16, 6, 4);
            }
        }

        const ufo = new UFO();
        let ufoSpawnTimer = 0;

        window.addEventListener('keydown', (e) => {
            initAudio();
            if (e.code in keys) {
                keys[e.code] = true;
                if (e.code === 'Space' && gameState === 'PLAYING') {
                    shootPlayerBullet();
                }
            }
            if (e.code === 'KeyP') {
                togglePause();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code in keys) {
                keys[e.code] = false;
            }
        });

        // Touch Control Listeners
        const setupTouch = (elem, keyName) => {
            elem.addEventListener('touchstart', (e) => {
                e.preventDefault();
                initAudio();
                keys[keyName] = true;
                if (keyName === 'Space' && gameState === 'PLAYING') {
                    shootPlayerBullet();
                }
            });
            elem.addEventListener('touchend', (e) => {
                e.preventDefault();
                keys[keyName] = false;
            });
        };

        setupTouch(btnLeft, 'ArrowLeft');
        setupTouch(btnRight, 'ArrowRight');
        setupTouch(btnFire, 'Space');

        startBtn.addEventListener('click', () => {
            initAudio();
            startGame();
        });

        restartBtn.addEventListener('click', () => {
            initAudio();
            startGame();
        });

        pauseBtn.addEventListener('click', () => {
            togglePause();
        });

        soundToggle.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            soundStatus.textContent = soundEnabled ? 'SOUND: ON' : 'SOUND: OFF';
        });

        function shootPlayerBullet() {
            // Maximum 2 active player bullets allowed at once (classic arcade rule)
            if (playerBullets.length < 2) {
                playerBullets.push(new Bullet(player.x + player.width / 2 - 2, player.y, -8, '#ffffff', true));
                playSound('shoot');
            }
        }

        function togglePause() {
            if (gameState === 'PLAYING') {
                gameState = 'PAUSED';
                pauseMenu.classList.remove('hidden');
            } else if (gameState === 'PAUSED') {
                gameState = 'PLAYING';
                pauseMenu.classList.add('hidden');
            }
        }

        function startGame() {
            score = 0;
            wave = 1;
            lives = 3;
            updateHUD();
            startMenu.classList.add('hidden');
            gameOverMenu.classList.add('hidden');
            pauseMenu.classList.add('hidden');
            
            player.x = GAME_WIDTH / 2 - 20;
            player.isHit = false;

            playerBullets = [];
            invaderBullets = [];
            particles = [];

            createInvaderGrid();
            createShields();

            gameState = 'PLAYING';
        }

        function updateHUD() {
            scoreVal.textContent = String(score).padStart(5, '0');
            highScoreVal.textContent = String(highScore).padStart(5, '0');
            waveVal.textContent = wave;
            livesContainer.textContent = '❤️'.repeat(lives);
        }

        function checkAABB(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        function updateGame() {
            if (gameState !== 'PLAYING') return;

            // Player movement
            if ((keys.ArrowLeft || keys.KeyA) && player.x > 10) {
                player.x -= player.speed;
            }
            if ((keys.ArrowRight || keys.KeyD) && player.x < GAME_WIDTH - player.width - 10) {
                player.x += player.speed;
            }

            // Update player bullets
            for (let i = playerBullets.length - 1; i >= 0; i--) {
                const bullet = playerBullets[i];
                bullet.update();

                // Bullet off screen
                if (bullet.y < 0) {
                    playerBullets.splice(i, 1);
                    continue;
                }

                // Check collision with Shield
                let bulletDestroyed = false;
                for (let shield of shields) {
                    if (checkAABB(bullet, shield)) {
                        if (shield.damage(bullet.x, bullet.y)) {
                            playerBullets.splice(i, 1);
                            bulletDestroyed = true;
                            break;
                        }
                    }
                }
                if (bulletDestroyed) continue;

                // Check collision with UFO
                if (ufo.active && checkAABB(bullet, ufo)) {
                    const pts = ufo.points[Math.floor(Math.random() * ufo.points.length)];
                    score += pts;
                    if (score > highScore) {
                        highScore = score;
                        localStorage.setItem('invaders_highscore', highScore);
                    }
                    createExplosion(ufo.x + ufo.width / 2, ufo.y + ufo.height / 2, '#ff3333', 20);
                    playSound('invaderKill');
                    ufo.active = false;
                    playerBullets.splice(i, 1);
                    updateHUD();
                    continue;
                }

                // Check collision with Invaders
                for (let invader of invaders) {
                    if (invader.alive && checkAABB(bullet, invader)) {
                        invader.alive = false;
                        score += invader.points;
                        if (score > highScore) {
                            highScore = score;
                            localStorage.setItem('invaders_highscore', highScore);
                        }
                        createExplosion(invader.x + invader.width / 2, invader.y + invader.height / 2, invader.color, 12);
                        playSound('invaderKill');
                        playerBullets.splice(i, 1);

                        // Increase speed as remaining invaders drop
                        const aliveCount = invaders.filter(inv => inv.alive).length;
                        if (aliveCount > 0) {
                            invaderMoveInterval = Math.max(2, Math.floor((aliveCount / (INVADER_ROWS * INVADER_COLS)) * 40));
                        } else {
                            // Wave Cleared!
                            wave++;
                            updateHUD();
                            setTimeout(() => {
                                createInvaderGrid();
                            }, 1000);
                        }

                        updateHUD();
                        break;
                    }
                }
            }

            // Update Invader Bullets
            for (let i = invaderBullets.length - 1; i >= 0; i--) {
                const bullet = invaderBullets[i];
                bullet.update();

                if (bullet.y > GAME_HEIGHT) {
                    invaderBullets.splice(i, 1);
                    continue;
                }

                // Invader bullet vs Shield
                let bulletDestroyed = false;
                for (let shield of shields) {
                    if (checkAABB(bullet, shield)) {
                        if (shield.damage(bullet.x, bullet.y)) {
                            invaderBullets.splice(i, 1);
                            bulletDestroyed = true;
                            break;
                        }
                    }
                }
                if (bulletDestroyed) continue;

                // Invader bullet vs Player
                if (checkAABB(bullet, player)) {
                    invaderBullets.splice(i, 1);
                    playerHit();
                    break;
                }
            }

            // Invader movement rhythm logic
            invaderMoveTimer++;
            if (invaderMoveTimer >= invaderMoveInterval) {
                invaderMoveTimer = 0;
                gameStepCount++;
                invaderAnimationFrame = invaderAnimationFrame === 0 ? 1 : 0;
                playSound('invaderStep');

                let edgeReached = false;
                const activeInvaders = invaders.filter(inv => inv.alive);

                for (let inv of activeInvaders) {
                    if ((invaderDirection === 1 && inv.x + inv.width >= GAME_WIDTH - 20) ||
                        (invaderDirection === -1 && inv.x <= 20)) {
                        edgeReached = true;
                        break;
                    }
                }

                if (edgeReached) {
                    invaderDirection *= -1;
                    for (let inv of activeInvaders) {
                        inv.y += 16;
                        // Game Over condition: Invaders reached bottom/player line
                        if (inv.y + inv.height >= player.y) {
                            triggerGameOver();
                        }
                    }
                } else {
                    for (let inv of activeInvaders) {
                        inv.x += invaderDirection * 10;
                    }
                }

                // Random Invader Firing
                if (activeInvaders.length > 0 && Math.random() < 0.65) {
                    const shooter = activeInvaders[Math.floor(Math.random() * activeInvaders.length)];
                    invaderBullets.push(new Bullet(shooter.x + shooter.width / 2, shooter.y + shooter.height, 5, '#ff3333'));
                }
            }

            // UFO Spawn logic
            ufoSpawnTimer++;
            if (ufoSpawnTimer > 800 && Math.random() < 0.005) {
                if (!ufo.active) {
                    ufo.spawn();
                    ufoSpawnTimer = 0;
                }
            }
            ufo.update();

            // Update particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function playerHit() {
            lives--;
            playSound('explosion');
            createExplosion(player.x + player.width / 2, player.y + player.height / 2, '#33ff33', 25);
            updateHUD();

            if (lives <= 0) {
                triggerGameOver();
            } else {
                player.isHit = true;
                setTimeout(() => {
                    player.isHit = false;
                }, 1200);
            }
        }

        function triggerGameOver() {
            gameState = 'GAMEOVER';
            finalScore.textContent = `FINAL SCORE: ${score}`;
            gameOverMenu.classList.remove('hidden');
        }

        function render() {
            // Clear canvas screen
            ctx.fillStyle = '#050508';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            // Draw Stars background
            ctx.fillStyle = '#ffffff';
            for (let i = 0; i < 30; i++) {
                const sx = (i * 137) % GAME_WIDTH;
                const sy = (i * 219) % GAME_HEIGHT;
                ctx.fillRect(sx, sy, 1, 1);
            }

            // Draw Shields
            for (let shield of shields) {
                shield.draw();
            }

            // Draw Player
            player.draw();

            // Draw Invaders
            for (let invader of invaders) {
                invader.draw();
            }

            // Draw UFO
            ufo.draw();

            // Draw Bullets
            for (let bullet of playerBullets) {
                bullet.draw();
            }
            for (let bullet of invaderBullets) {
                bullet.draw();
            }

            // Draw Particles
            for (let particle of particles) {
                particle.draw();
            }

            // Draw Ground Line
            ctx.strokeStyle = '#33ff33';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, GAME_HEIGHT - 20);
            ctx.lineTo(GAME_WIDTH, GAME_HEIGHT - 20);
            ctx.stroke();
        }

        function gameLoop() {
            updateGame();
            render();
            requestAnimationFrame(gameLoop);
        }

        // Start the game animation loop when window finishes loading
        window.onload = () => {
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
</html>
